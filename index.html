.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.app>*{min-width:0}
.rail{background:var(--rail);color:var(--rail-ink);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand img{width:40px;height:43px;border-radius:6px;object-fit:cover}
.brand b{font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.06em;display:block}
.brand span{font-size:11px;color:var(--rail-muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav .grp{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--rail-muted);padding:12px 10px 4px}
.nav a{color:var(--rail-ink);text-decoration:none;padding:8px 10px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:rgba(214,178,90,.14);color:var(--rail-gold)}
.nav a .cnt{font-family:var(--f-mono);font-size:11px;background:var(--bad);color:#fff;border-radius:99px;padding:0 6px;line-height:18px}
.sync{margin-top:auto;font-size:11.5px;color:var(--rail-muted);padding:0 8px;display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rail-muted);flex:none}
.dot.ok{background:#4CC27F}.dot.err{background:#F07B70}
main{min-width:0;padding-block:22px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between}
.head h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.01em;margin:0;text-wrap:balance}
.head p{margin:2px 0 0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:1000px){.k6{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.k6{grid-template-columns:1fr}}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center}
.kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.kpi .val{font-family:var(--f-display);font-weight:500;font-size:22px;margin-top:6px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi .sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.kpi.accent{background:var(--rail);color:var(--rail-ink);border-color:var(--rail)}
.kpi.accent .lbl,.kpi.accent .sub{color:var(--rail-muted)}
.kpi.accent .val{color:var(--rail-gold)}
.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.pri:hover{background:var(--gold-strong)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:4px 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted);font-weight:600;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=number]{font-variant-numeric:tabular-nums}
.fg{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap;position:sticky;top:0}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.note{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.good{background:var(--good-soft);border-color:transparent;color:var(--good)}
.lines{display:flex;flex-direction:column;gap:8px}
.line{display:grid;grid-template-columns:minmax(150px,2fr) minmax(120px,1.4fr) 90px 130px 120px 34px;gap:8px;align-items:start}
.line .x{margin-top:20px}
.line.compra{grid-template-columns:minmax(150px,2.4fr) 100px 140px 130px 34px}
.line .tot{font-variant-numeric:tabular-nums;text-align:right;padding:8px 2px;font-weight:600}
.line .hint{font-size:11.5px;color:var(--muted);font-weight:500}
.line .hint.bad{color:var(--bad)}
.x{border:0;background:transparent;color:var(--muted);font-size:18px;cursor:pointer;border-radius:6px;height:36px}
.x:hover{color:var(--bad);background:var(--bad-soft)}
.totals{display:flex;flex-direction:column;gap:4px;align-items:flex-end;font-variant-numeric:tabular-nums}
.totals .big{font-family:var(--f-display);font-size:24px;font-weight:500}
.pay{display:grid;grid-template-columns:1fr 1fr 150px 34px;gap:8px;align-items:end}
.list-alert{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.list-alert li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line)}
.list-alert li:last-child{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:120px 1fr 110px;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar .fl{height:100%;background:var(--gold);border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
svg text{fill:var(--muted);font-family:var(--f-body)}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:3px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.cli{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--surface-2);border:1px solid var(--line)}
.cli b{display:block}
dialog{border:1px solid var(--line);border-radius:14px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 40px);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(8,8,10,.55)}
dialog .dh{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
dialog .dh h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:500}
dialog .db{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
dialog .df{padding:0 18px 16px;display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
dialog.wide{width:min(760px,calc(100vw - 32px))}
.receipt{border:1px dashed var(--line);border-radius:10px;padding:16px;background:var(--surface-2)}
.receipt .rh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:10px}
.receipt .rh b{font-family:var(--f-display);font-size:15px;letter-spacing:.04em}
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--rail);color:var(--rail-ink);padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.3);font-weight:500;max-width:min(420px,calc(100vw - 32px));z-index:50;border-left:3px solid var(--rail-gold)}
.toast.err{border-left-color:#F07B70}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)}
.chk input{width:auto}
.sec-title{font-family:var(--f-display);font-size:14px;font-weight:500;margin:0}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:10px max(12px,env(safe-area-inset-left,0px)) 10px;padding-top:calc(10px + env(safe-area-inset-top,0px));gap:10px;z-index:20;overflow:visible}
  .brand span,.brand b{display:none}
  .brand img{width:32px;height:34px}
  .nav{flex-direction:row;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
  .nav .grp{display:none}
  .nav a{white-space:nowrap;padding:7px 10px}
  .sync,.rst{display:none}
  .line,.line.compra{grid-template-columns:1fr 1fr;padding:10px;border:1px solid var(--line);border-radius:8px}
  .line .tot{text-align:left}
  .pay{grid-template-columns:1fr 1fr}
  .bar{grid-template-columns:90px 1fr 90px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
"use strict";
/* ======================= utilidades ======================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COP = new Intl.NumberFormat("es-CO", {style:"currency", currency:"COP", maximumFractionDigits:0});
const money = n => COP.format(Math.round(Number(n) || 0));
const num = n => new Intl.NumberFormat("es-CO").format(Math.round((Number(n)||0)*100)/100);
const N = v => { const x = Number(v); return isFinite(x) ? x : 0; };
const pad = (n, w=4) => String(n).padStart(w, "0");
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`; };
const parseD = s => { if (!s) return null; const [y,m,d] = String(s).slice(0,10).split("-").map(Number); return new Date(y, m-1, d); };
const toISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1,2)}-${pad(d.getDate(),2)}`;
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return toISO(d); };
const fmtD = s => { const d = parseD(s); return d ? d.toLocaleDateString("es-CO", {day:"2-digit", month:"short", year:"numeric"}) : ""; };
const fmtDs = s => { const d = parseD(s); return d ? d.toLocaleDateString("es-CO", {day:"2-digit", month:"short"}) : ""; };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 86400000);
const CF = "222222222222"; // consumidor final (igual que en el Excel)
const FORMAS = ["Efectivo", "Transferencia", "Crédito"];
const MEDIOS = {Transferencia:["Nequi","Bancolombia"], "Crédito":["Bold","Addi","Sistecrédito"]};
const sum = (a, f) => a.reduce((s, x) => s + N(f(x)), 0);

let toastT;
function toast(msg, err) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 4200); }

/* ======================= estado ======================= */
const COLS = ["productos","clientes","proveedores","ventas","separes","compras"];
const S = {productos:[], clientes:[], proveedores:[], ventas:[], separes:[], compras:[], loaded:{}, db:null, dl:null, status:"loading"};
const UI = { ventas:{q:"", desde:"", hasta:"", forma:"", estado:"activa"}, resumen:{periodo:"mes"}, separes:{estado:"Separado"}, compras:{estado:""}, inv:{q:"", filtro:""}, clientes:{q:""} };

/* ======================= cálculos (lo que hacían las fórmulas) ======================= */
const prodBy = id => S.productos.find(p => p.id === id);
const cliBy = ced => S.clientes.find(c => c.id === String(ced));
const ventaTotal = v => sum(v.lineas || [], l => N(l.unidades) * N(l.precio));
const separeTotal = s => sum(s.lineas || [], l => N(l.unidades) * N(l.precio));
const separeAbonado = s => sum(s.abonos || [], a => a.valor);
const compraTotal = c => sum(c.lineas || [], l => N(l.cantidad) * N(l.costo));
const ventasActivas = () => S.ventas.filter(v => v.estado !== "anulada");

function inventario() {
  const m = {};
  for (const p of S.productos) m[p.id] = {p, entradas:N(p.cantInicial), comprado:0, vendido:0, separado:0};
  for (const c of S.compras) for (const l of c.lineas||[]) if (m[l.producto]) { m[l.producto].comprado += N(l.cantidad); m[l.producto].entradas += N(l.cantidad); }
  for (const v of ventasActivas()) for (const l of v.lineas||[]) if (l.producto && m[l.producto]) m[l.producto].vendido += N(l.unidades);
  for (const s of S.separes) if (s.estado === "Separado") for (const l of s.lineas||[]) if (m[l.producto]) m[l.producto].separado += N(l.unidades);
  for (const k in m) { const r = m[k]; r.disp = r.entradas - r.vendido - r.separado; r.valCosto = r.disp * N(r.p.costo); r.valVenta = r.disp * N(r.p.precio); r.sem = semaforo(r.disp, N(r.p.stockMin)); }
  return m;
}
// Semáforo: usa el stock mínimo de cada producto (el Excel usaba 0-3 / 4-10 / 11-100 / >100 para todos).
function semaforo(d, min) {
  if (d <= 0) return {t:"Agotado: comprar", c:"bad", k:"agotado"};
  if (d <= min) return {t:"Comprar mercancía", c:"bad", k:"comprar"};
  if (d <= Math.max(min * 2, min + 3)) return {t:"Inventario bajo", c:"warn", k:"bajo"};
  if (d > Math.max(100, min * 8)) return {t:"Exceso de inventario", c:"info", k:"exceso"};
  return {t:"Suficiente", c:"good", k:"ok"};
}
function proxCumple(iso) {
  if (!iso) return null; const b = parseD(iso), t = parseD(todayISO());
  let n = new Date(t.getFullYear(), b.getMonth(), b.getDate()); if (n < t) n = new Date(t.getFullYear()+1, b.getMonth(), b.getDate());
  let habiles = 0; if (n > t) { const d = new Date(t); while (d < n) { d.setDate(d.getDate()+1); if (d.getDay() !== 0) habiles++; } } // lunes a sábado
  return {fecha: toISO(n), habiles};
}
function alertaSepare(s) {
  if (s.estado !== "Separado" || !s.limite) return null;
  const d = daysBetween(todayISO(), s.limite);
  if (d < 0) return {t:`Vencido hace ${-d} día(s): contactar al cliente`, c:"bad"};
  if (d <= 3) return {t: d === 0 ? "Vence hoy" : `Vence en ${d} día(s)`, c:"warn"};
  return null;
}
function nextNum(arr) { return arr.reduce((m, x) => Math.max(m, N(x.numero)), 0) + 1; }

/* ======================= base de datos ======================= */
async function boot() {
  render();
  const timer = setTimeout(() => { if (S.status === "loading") { S.status = "slow"; render(); } }, 10000);
  let db = null;
  try { db = window.claude && await window.claude.use("db"); } catch (e) { db = null; }
  try { S.dl = window.claude && await window.claude.use("downloads"); } catch (e) { S.dl = null; }
  if (!db) { clearTimeout(timer); S.status = "nodb"; setSync("Sin conexión a los datos", "err"); render(); return; }
  S.db = db;
  for (const c of COLS) {
    db.collection(c).onSnapshot(snap => {
      S[c] = snap.docs.map(d => ({id: d.id, ...d.data()}));
      if (!snap.metadata.fromCache) S.loaded[c] = true;
      if (COLS.every(k => S.loaded[k])) { clearTimeout(timer); S.status = "ok"; setSync("Prototipo: datos guardados en este navegador", "ok"); }
      scheduleRender();
    }, e => { setSync("Error de conexión: " + e.code, "err"); toast("No se pudieron leer los datos (" + e.code + "). Recarga la página.", true); });
  }
}
function setSync(t, c) { $("#syncTxt").textContent = t; $("#syncDot").className = "dot " + (c||""); }
async function save(col, id, data) {
  try { await S.db.collection(col).doc(id).set(data); return true; }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random()*600)); try { await S.db.collection(col).doc(id).set(data); return true; } catch (e2) { e = e2; } }
    toast(e && e.code === "invalid_argument" ? "No tienes permiso para guardar cambios en esta app." : "No se pudo guardar: " + (e && (e.message || e.code)), true); return false;
  }
}
async function patch(col, id, data) { try { await S.db.collection(col).doc(id).update(data); return true; } catch (e) { toast("No se pudo guardar: " + (e && (e.message || e.code)), true); return false; } }
async function remove(col, id) { try { await S.db.collection(col).doc(id).delete(); return true; } catch (e) { toast("No se pudo borrar: " + (e && (e.message||e.code)), true); return false; } }
async function freeId(col, prefix, n) { // evita pisar un número que otro equipo acabó de usar
  for (let i = 0; i < 20; i++) { const id = prefix + pad(n + i); const s = await S.db.collection(col).doc(id).get(); if (!s.exists) return {id, numero: n + i}; }
  throw new Error("No se encontró número libre");
}

/* ======================= navegación ======================= */
const VIEWS = [
  {g:"Operación"},
  {k:"resumen", t:"Resumen"}, {k:"vender", t:"Nueva venta"}, {k:"ventas", t:"Ventas"}, {k:"separes", t:"Plan separe"}, {k:"compras", t:"Compras"},
  {g:"Bodega"},
  {k:"inventario", t:"Inventario"}, {k:"productos", t:"Productos"},
  {g:"Terceros"},
  {k:"clientes", t:"Clientes"}, {k:"proveedores", t:"Proveedores"},
];
const cur = () => { const h = location.hash.slice(1); return VIEWS.some(v => v.k === h) ? h : "resumen"; };
window.addEventListener("hashchange", () => { render(); window.scrollTo(0,0); });

let rq = false;
function scheduleRender() { if (rq) return; rq = true; requestAnimationFrame(() => { rq = false; if (!$("#dlg").open) render(); else render(true); }); }

function render(keepDialog) {
  // conservar foco/cursor al redibujar
  const a = document.activeElement, fid = a && a.id && $("#view").contains(a) ? a.id : null, ss = fid && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  const k = cur(); const alerts = countAlerts();
  $("#nav").innerHTML = VIEWS.map(v => v.g ? `<div class="grp">${v.g}</div>` : `<a href="#${v.k}" class="${v.k===k?"on":""}">${v.t}${v.k==="resumen"&&alerts?`<span class="cnt" title="Alertas">${alerts}</span>`:""}</a>`).join("");
  let html;
  if (S.status === "nodb") html = `<div class="card empty"><h1 class="sec-title">No se pudo abrir la base de datos</h1><p>Abre esta app desde claude.ai con tu sesión iniciada para ver y guardar la información de la bodega.</p></div>`;
  else if (!COLS.every(c => S.loaded[c]) && !S.productos.length) html = `<div class="card empty">${S.status === "slow" ? "Los datos están tardando en cargar. Revisa tu conexión; la página seguirá intentando." : "Cargando la información de la bodega…"}</div>`;
  else html = V[k]();
  $("#view").innerHTML = html;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (ss) try { el.setSelectionRange(ss[0], ss[1]); } catch (e) {} } }
  if (k === "vender" || k === "separes" || k === "compras") updateTotals();
}

function countAlerts() {
  if (!S.productos.length) return 0;
  const inv = inventario(); let n = 0;
  for (const k in inv) if (["agotado","comprar"].includes(inv[k].sem.k)) n++;
  n += S.separes.filter(s => alertaSepare(s)).length;
  n += S.clientes.filter(c => { const p = proxCumple(c.cumple); return p && p.habiles <= 1; }).length;
  return n;
}

/* ======================= vistas ======================= */
const V = {};
const head = (t, sub, right = "") => `<div class="head"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div><div class="row">${right}</div></div>`;
const pill = (t, c) => `<span class="pill ${c||""}">${esc(t)}</span>`;

/* ---------- Resumen ---------- */
V.resumen = () => {
  const per = UI.resumen.periodo, hoy = todayISO();
  const desde = per === "mes" ? hoy.slice(0,8) + "01" : per === "30" ? addDays(hoy, -29) : "0000-00-00";
  const vs = ventasActivas().filter(v => v.fecha >= desde && v.fecha <= hoy);
  const total = sum(vs, ventaTotal), hoyT = sum(vs.filter(v => v.fecha === hoy), ventaTotal);
  const inv = inventario(), invArr = Object.values(inv);
  const costoInv = sum(invArr, r => r.valCosto);
  const sepAct = S.separes.filter(s => s.estado === "Separado");
  const porCobrar = sum(sepAct, s => separeTotal(s) - separeAbonado(s));
  const porPagar = sum(S.compras.filter(c => c.estado === "Pendiente de pago"), compraTotal);
  // costo de lo vendido (para margen estimado)
  let costoV = 0, sinProd = 0, sinProdV = 0;
  for (const v of vs) for (const l of v.lineas||[]) { if (l.producto && prodBy(l.producto)) costoV += N(l.unidades) * N(prodBy(l.producto).costo); else { sinProd++; sinProdV += N(l.unidades)*N(l.precio); } }
  const ventasConProd = total - sinProdV;
  const margen = ventasConProd > 0 ? (ventasConProd - costoV) / ventasConProd : 0;
  // por día
  const dias = per === "todo" ? [...new Set(vs.map(v => v.fecha))].sort() : (() => { const a = []; let d = desde; while (d <= hoy) { a.push(d); d = addDays(d, 1); } return a; })();
  const porDia = dias.map(d => ({d, v: sum(vs.filter(x => x.fecha === d), ventaTotal)}));
  // por forma de pago
  const fp = {}; for (const v of vs) for (const p of v.pagos||[]) { const k = p.forma === "Transferencia" || p.forma === "Crédito" ? `${p.forma} · ${p.medio||"?"}` : p.forma; fp[k] = (fp[k]||0) + N(p.valor); }
  const fpArr = Object.entries(fp).sort((a,b) => b[1]-a[1]); const fpMax = Math.max(1, ...fpArr.map(x => x[1]));
  // top productos
  const tp = {}; for (const v of vs) for (const l of v.lineas||[]) { const k = l.producto ? (prodBy(l.producto)?.nombre || l.producto) : "Sin producto asignado"; tp[k] = tp[k] || {u:0, v:0}; tp[k].u += N(l.unidades); tp[k].v += N(l.unidades)*N(l.precio); }
  const tpArr = Object.entries(tp).sort((a,b) => b[1].v - a[1].v).slice(0, 8); const tpMax = Math.max(1, ...tpArr.map(x => x[1].v));
  // alertas
  const al = [];
  for (const r of invArr.filter(r => ["agotado","comprar"].includes(r.sem.k))) al.push({c:"bad", t:`${r.p.nombre}: quedan ${num(r.disp)} (mínimo ${num(r.p.stockMin)})`, a:`<a class="btn sm" href="#compras">Comprar</a>`});
  for (const s of S.separes) { const a = alertaSepare(s); if (a) al.push({c:a.c, t:`Separe ${s.id} de ${esc(s.clienteNombre)}: ${a.t}`, a:`<a class="btn sm" href="#separes">Ver</a>`}); }
  for (const c of S.clientes) { const p = proxCumple(c.cumple); if (p && p.habiles <= 1) al.push({c:"gold", t:`Cumpleaños de ${esc(c.nombre)} el ${fmtDs(p.fecha)}: enviar descuento (cel. ${esc(c.celular)})`, a:""}); }
  const sinPrecio = S.productos.filter(p => !N(p.precio)).length;
  if (sinPrecio) al.push({c:"warn", t:`${sinPrecio} producto(s) sin precio de venta: el valor del inventario a precio de venta queda incompleto`, a:`<a class="btn sm" href="#productos">Completar</a>`});
  if (sinProd) al.push({c:"warn", t:`${sinProd} línea(s) de venta del periodo sin producto asignado (${money(sinProdV)}): no descuentan inventario`, a:`<a class="btn sm" href="#ventas" data-act="filtroSinProd">Revisar</a>`});

  return head("Resumen", `Ventas ${per==="mes"?"de este mes":per==="30"?"de los últimos 30 días":"de todo el historial"} · hoy es ${fmtD(hoy)}`,
    `<div class="tabs" role="tablist">${[["mes","Este mes"],["30","30 días"],["todo","Todo"]].map(([k,t]) => `<button data-act="periodo" data-v="${k}" class="${per===k?"on":""}">${t}</button>`).join("")}</div><a class="btn pri" href="#vender">+ Nueva venta</a>`) +
  `<div class="grid k6">
    <div class="card kpi accent"><div class="lbl">Ventas del periodo</div><div class="val">${money(total)}</div><div class="sub">${vs.length} facturas · ticket promedio ${money(vs.length ? total/vs.length : 0)}</div></div>
    <div class="card kpi"><div class="lbl">Vendido hoy</div><div class="val">${money(hoyT)}</div><div class="sub">${vs.filter(v=>v.fecha===hoy).length} facturas</div></div>
    <div class="card kpi"><div class="lbl">Margen bruto estimado</div><div class="val">${(margen*100).toFixed(0)}%</div><div class="sub">${money(ventasConProd - costoV)} sobre ventas con producto</div></div>
    <div class="card kpi"><div class="lbl">Inventario a costo</div><div class="val">${money(costoInv)}</div><div class="sub">${num(sum(invArr, r => r.disp))} unidades disponibles</div></div>
    <div class="card kpi"><div class="lbl">Por cobrar en separes</div><div class="val">${money(porCobrar)}</div><div class="sub">${sepAct.length} separes activos</div></div>
    <div class="card kpi"><div class="lbl">Por pagar a proveedores</div><div class="val">${money(porPagar)}</div><div class="sub">compras a crédito pendientes</div></div>
  </div>
  <div class="card"><h2>Ventas por día</h2>${chartDias(porDia)}</div>
  <div class="grid g2">
    <div class="card"><h2>Por forma de pago</h2>${fpArr.length ? `<div class="bars">${fpArr.map(([k,v]) => `<div class="bar"><span>${esc(k)}</span><div class="tr"><div class="fl" style="width:${(v/fpMax*100).toFixed(1)}%"></div></div><span class="v">${money(v)}</span></div>`).join("")}</div>` : `<p class="muted">Sin ventas en el periodo.</p>`}</div>
    <div class="card"><h2>Productos más vendidos</h2>${tpArr.length ? `<div class="bars">${tpArr.map(([k,v]) => `<div class="bar"><span title="${esc(k)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div class="tr"><div class="fl" style="width:${(v.v/tpMax*100).toFixed(1)}%"></div></div><span class="v">${money(v.v)} <span class="muted">· ${num(v.u)}u</span></span></div>`).join("")}</div>` : `<p class="muted">Sin ventas en el periodo.</p>`}</div>
  </div>
  <div class="card"><h2>Alertas <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">${al.length} pendiente(s)</span></h2>${al.length ? `<ul class="list-alert">${al.map(x => `<li><span>${pill(x.c==="bad"?"Urgente":x.c==="gold"?"Cumpleaños":"Revisar", x.c)} &nbsp;${x.t}</span>${x.a}</li>`).join("")}</ul>` : `<p class="muted">Todo en orden: no hay stock por comprar, separes por vencer ni cumpleaños cercanos.</p>`}</div>`;
};
function chartDias(rows) {
  if (!rows.length || rows.every(r => !r.v)) return `<p class="muted">Sin ventas en el periodo.</p>`;
  const W = 1000, H = 220, L = 70, B = 28, T = 12, max = Math.max(...rows.map(r => r.v));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step || 1, bw = (W - L - 10) / rows.length;
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = ""; for (let v = 0; v <= top + 1; v += step) g += `<line x1="${L}" x2="${W-6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y(v)+4}" text-anchor="end" font-size="12">${short(v)}</text>`;
  const every = Math.ceil(rows.length / 12);
  const bars = rows.map((r, i) => { const x = L + i*bw + bw*0.18, w = Math.max(2, bw*0.64), yy = y(r.v); return `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${(H-B-yy).toFixed(1)}" rx="2" fill="var(--gold)"><title>${fmtD(r.d)}: ${money(r.v)}</title></rect>${i % every === 0 ? `<text x="${(x+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="12">${fmtDs(r.d)}</text>` : ""}`; }).join("");
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:560px;height:auto" role="img" aria-label="Ventas por día">${g}${bars}</svg></div>`;
}
const niceStep = x => { if (x <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(x))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; };
const short = v => v >= 1e6 ? `$${(v/1e6).toLocaleString("es-CO",{maximumFractionDigits:1})} M` : v >= 1e3 ? `$${(v/1e3).toLocaleString("es-CO",{maximumFractionDigits:0})} mil` : `$${v}`;

/* ---------- editor de líneas (venta, separe, compra) ---------- */
const D = { venta:null, separe:null, compra:null };
function newVenta() { return {fecha: todayISO(), cedula:"", nuevo:{nombre:"", direccion:"", celular:"", cumple:""}, lineas:[blankLine()], pagos:[{forma:"Efectivo", medio:"", valor:"", auto:true}], nota:""}; }
function newSepare() { const f = todayISO(); return {fecha:f, limite:addDays(f,30), cedula:"", nuevo:{nombre:"", direccion:"", celular:"", cumple:""}, lineas:[blankLine()], abono:"", forma:"Efectivo", medio:"", nota:""}; }
function newCompra() { return {fecha: todayISO(), proveedor:"", forma:"Efectivo", lineas:[{producto:"", cantidad:"", costo:""}], nota:""}; }
function blankLine() { return {producto:"", detalle:"", unidades:1, precio:""}; }

function productOptions(sel, inv, allowOtro) {
  const ps = [...S.productos].sort((a,b) => a.id.localeCompare(b.id));
  return `<option value="">Elegir producto…</option>` + ps.map(p => `<option value="${p.id}" ${sel===p.id?"selected":""}>${esc(p.nombre)}${inv?` · disp. ${num(inv[p.id]?.disp ?? 0)}`:""}</option>`).join("") + (allowOtro ? `<option value="__otro" ${sel==="__otro"?"selected":""}>Otro (no está en inventario)</option>` : "");
}
function linesEditor(kind) {
  const d = D[kind], inv = inventario();
  if (kind === "compra") return `<div class="lines">${d.lineas.map((l, i) => `<div class="line compra">
      <label class="f">Producto<select id="c-p-${i}" data-bind="compra.lineas.${i}.producto" data-re="1">${productOptions(l.producto, inv)}</select></label>
      <label class="f">Cantidad<input id="c-q-${i}" type="number" min="0" step="1" inputmode="numeric" value="${esc(l.cantidad)}" data-bind="compra.lineas.${i}.cantidad"></label>
      <label class="f">Costo unitario<input id="c-c-${i}" type="number" min="0" step="1" inputmode="numeric" value="${esc(l.costo)}" data-bind="compra.lineas.${i}.costo"></label>
      <div><div class="hint">Total</div><div class="tot" data-tot="compra.${i}"></div></div>
      <button class="x" title="Quitar línea" aria-label="Quitar línea" data-act="delLine" data-k="compra" data-i="${i}">×</button></div>`).join("")}</div>
    <div class="row"><button class="btn sm" data-act="addLine" data-k="compra">+ Agregar producto</button></div>`;
  const pre = kind === "venta" ? "v" : "s";
  return `<div class="lines">${d.lineas.map((l, i) => {
    const r = inv[l.producto]; const pedidas = sum(d.lineas.filter(x => x.producto === l.producto), x => x.unidades);
    const hint = l.producto === "__otro" ? `<span class="hint">No descuenta inventario</span>` : r ? `<span class="hint ${pedidas > r.disp ? "bad" : ""}">Disponible: ${num(r.disp)}${pedidas > r.disp ? " · no alcanza" : ""}</span>` : "";
    return `<div class="line">
      <label class="f">Producto<select id="${pre}-p-${i}" data-bind="${kind}.lineas.${i}.producto" data-re="1">${productOptions(l.producto, inv, kind === "venta")}</select>${hint}</label>
      <label class="f">Referencia / detalle<input id="${pre}-d-${i}" value="${esc(l.detalle)}" placeholder="${l.producto==="__otro"?"Obligatorio: ¿qué se vendió?":"Ej. Camiseta CK"}" data-bind="${kind}.lineas.${i}.detalle"></label>
      <label class="f">Unidades<input id="${pre}-u-${i}" type="number" min="1" step="1" inputmode="numeric" value="${esc(l.unidades)}" data-bind="${kind}.lineas.${i}.unidades" data-re-change="1"></label>
      <label class="f">Precio unitario<input id="${pre}-pr-${i}" type="number" min="0" step="100" inputmode="numeric" value="${esc(l.precio)}" data-bind="${kind}.lineas.${i}.precio"></label>
      <div><div class="hint">Valor</div><div class="tot" data-tot="${kind}.${i}"></div></div>
      <button class="x" title="Quitar línea" aria-label="Quitar línea" data-act="delLine" data-k="${kind}" data-i="${i}">×</button></div>`; }).join("")}</div>
    <div class="row"><button class="btn sm" data-act="addLine" data-k="${kind}">+ Agregar producto</button><span class="muted" style="font-size:12.5px">Hasta 30 productos por documento</span></div>`;
}
function linesTotal(kind) { const d = D[kind]; return kind === "compra" ? sum(d.lineas, l => N(l.cantidad)*N(l.costo)) : sum(d.lineas, l => N(l.unidades)*N(l.precio)); }
function updateTotals() {
  for (const kind of ["venta","separe","compra"]) {
    const d = D[kind]; if (!d) continue;
    d.lineas.forEach((l, i) => { const el = document.querySelector(`[data-tot="${kind}.${i}"]`); if (el) { const v = kind === "compra" ? N(l.cantidad)*N(l.costo) : N(l.unidades)*N(l.precio); el.textContent = v ? money(v) : "—"; } });
    const t = linesTotal(kind); const el = document.querySelector(`[data-total="${kind}"]`); if (el) el.textContent = money(t);
    if (kind === "venta") {
      if (d.pagos.length === 1 && d.pagos[0].auto) { d.pagos[0].valor = t || ""; const inp = $("#v-pay-v-0"); if (inp && document.activeElement !== inp) inp.value = t || ""; }
      const pag = sum(d.pagos, p => p.valor), diff = t - pag, el2 = $("#payDiff");
      if (el2) el2.innerHTML = !t ? "" : Math.abs(diff) < 1 ? `<span class="pill good">Pagos cuadran con el total</span>` : `<span class="pill bad">${diff > 0 ? "Faltan " + money(diff) : "Sobran " + money(-diff)} en los pagos</span>`;
    }
    if (kind === "separe") { const ab = N(d.abono), el3 = $("#sepSaldo"); if (el3) el3.textContent = money(t - ab); }
  }
}

function clienteBlock(kind) {
  const d = D[kind], ced = String(d.cedula||"").trim(), c = ced && cliBy(ced), p = kind === "venta" ? "v" : "s";
  const dl = `<datalist id="cliList">${S.clientes.map(c => `<option value="${esc(c.id)}">${esc(c.nombre)}</option>`).join("")}</datalist>`;
  let info = "";
  if (!ced) info = `<p class="muted" style="margin:0">${kind === "venta" ? "Escribe la cédula o NIT, o usa Consumidor final si el cliente no da datos." : "El plan separe necesita un cliente registrado."}</p>`;
  else if (ced === CF) info = kind === "venta" ? `<div class="cli"><div><b>Consumidor final</b><span class="muted">Sin datos del cliente</span></div></div>` : `<div class="note bad">Para plan separe usa la cédula de un cliente registrado.</div>`;
  else if (c) { const pc = proxCumple(c.cumple); info = `<div class="cli"><div style="flex:1"><b>${esc(c.nombre)}</b><span class="muted">${esc(c.celular)} · ${esc(c.direccion)}${c.cumple?` · cumpleaños ${fmtDs(c.cumple)}`:""}</span></div>${pc && pc.habiles <= 1 ? pill("Cumpleaños cerca: aplicar descuento", "gold") : pill("Cliente registrado","good")}</div>`; }
  else info = `<div class="note warn">Cliente nuevo: llena sus datos y quedará guardado al ${kind==="venta"?"cargar la venta":"guardar el separe"}.</div>
    <div class="fg"><label class="f">Nombre<input id="${p}-n-nom" value="${esc(d.nuevo.nombre)}" data-bind="${kind}.nuevo.nombre"></label>
    <label class="f">Dirección<input id="${p}-n-dir" value="${esc(d.nuevo.direccion)}" data-bind="${kind}.nuevo.direccion"></label>
    <label class="f">Celular<input id="${p}-n-cel" inputmode="tel" value="${esc(d.nuevo.celular)}" data-bind="${kind}.nuevo.celular"></label>
    <label class="f">Cumpleaños (opcional)<input id="${p}-n-cum" type="date" value="${esc(d.nuevo.cumple)}" data-bind="${kind}.nuevo.cumple"></label></div>`;
  return `${dl}<div class="fg"><label class="f">Cédula o NIT<input id="${p}-ced" list="cliList" inputmode="numeric" autocomplete="off" value="${esc(d.cedula)}" data-bind="${kind}.cedula" data-re-change="1" placeholder="Buscar o escribir"></label>
    ${kind==="venta"?`<div style="display:flex;align-items:flex-end"><button class="btn" data-act="cf">Consumidor final</button></div>`:""}</div>${info}`;
}

/* ---------- Nueva venta ---------- */
V.vender = () => {
  if (!D.venta) D.venta = newVenta();
  const d = D.venta, n = nextNum(S.ventas);
  return head("Nueva venta", `Factura F-${pad(n)} (número provisional, se confirma al cargar)`, `<button class="btn" data-act="resetVenta">Limpiar</button>`) +
  `<div class="card"><h2>Cliente y fecha</h2><div class="fg" style="margin-bottom:12px"><label class="f">Fecha<input id="v-fecha" type="date" value="${esc(d.fecha)}" data-bind="venta.fecha"></label></div>${clienteBlock("venta")}</div>
  <div class="card"><h2>Productos</h2>${linesEditor("venta")}</div>
  <div class="card"><h2>Pago <span class="muted" style="text-transform:none;letter-spacing:0;font-weight:500">Puedes dividirlo en varias formas (pago mixto)</span></h2>
    <div class="lines">${d.pagos.map((p, i) => `<div class="pay">
      <label class="f">Forma de pago<select id="v-pay-f-${i}" data-bind="venta.pagos.${i}.forma" data-re="1">${FORMAS.map(f => `<option ${p.forma===f?"selected":""}>${f}</option>`).join("")}</select></label>
      <label class="f">${p.forma==="Crédito"?"Plataforma":"Medio"}${MEDIOS[p.forma] ? `<select id="v-pay-m-${i}" data-bind="venta.pagos.${i}.medio"><option value="">Elegir…</option>${MEDIOS[p.forma].map(m => `<option ${p.medio===m?"selected":""}>${m}</option>`).join("")}</select>` : `<input disabled value="No aplica">`}</label>
      <label class="f">Valor<input id="v-pay-v-${i}" type="number" min="0" step="100" inputmode="numeric" value="${esc(p.valor)}" data-bind="venta.pagos.${i}.valor" data-noauto="${i}"></label>
      ${d.pagos.length > 1 ? `<button class="x" aria-label="Quitar pago" data-act="delPay" data-i="${i}">×</button>` : "<span></span>"}</div>`).join("")}</div>
    <div class="row" style="margin-top:10px;justify-content:space-between"><button class="btn sm" data-act="addPay">+ Dividir pago</button><span id="payDiff"></span></div>
    <label class="f" style="margin-top:12px">Nota (opcional)<input id="v-nota" value="${esc(d.nota)}" data-bind="venta.nota" placeholder="Ej. cambio de talla, promoción…"></label>
  </div>
  <div class="card row" style="justify-content:space-between"><div class="totals" style="align-items:flex-start"><span class="muted">Total de la factura</span><span class="big" data-total="venta">$0</span></div>
    <button class="btn pri" data-act="saveVenta" style="padding:12px 22px;font-size:15px">Cargar venta</button></div>`;
};
async function ensureCliente(kind) {
  const d = D[kind], ced = String(d.cedula||"").trim();
  if (!ced || ced === CF || cliBy(ced)) return true;
  const n = d.nuevo; if (!n.nombre.trim() || !n.direccion.trim() || !n.celular.trim()) { toast("Cliente nuevo: escribe nombre, dirección y celular.", true); return false; }
  return save("clientes", ced, {nombre:n.nombre.trim(), direccion:n.direccion.trim(), celular:n.celular.trim(), cumple:n.cumple||"", creado:new Date().toISOString()});
}
function validateLines(kind, checkStock) {
  const d = D[kind], inv = inventario(); const ls = d.lineas.filter(l => l.producto || N(l.precio) || l.detalle);
  if (!ls.length) return "Agrega al menos un producto.";
  for (const [i, l] of ls.entries()) {
    if (!l.producto) return `Línea ${i+1}: elige el producto.`;
    if (l.producto === "__otro" && !String(l.detalle).trim()) return `Línea ${i+1}: escribe qué producto se vendió.`;
    if (!(N(l.unidades) > 0)) return `Línea ${i+1}: las unidades deben ser mayores a 0.`;
    if (l.precio === "" || N(l.precio) < 0) return `Línea ${i+1}: escribe el precio unitario.`;
    if (checkStock && l.producto !== "__otro") { const ped = sum(ls.filter(x => x.producto === l.producto), x => x.unidades), disp = inv[l.producto]?.disp ?? 0; if (ped > disp) return `No hay suficiente stock de ${prodBy(l.producto)?.nombre}. Disponible: ${num(disp)}, pedidas: ${num(ped)}.`; }
  }
  return {ls: ls.map(l => ({producto: l.producto === "__otro" ? null : l.producto, nombre: l.producto === "__otro" ? "" : (prodBy(l.producto)?.nombre||""), detalle: String(l.detalle||"").trim(), unidades: N(l.unidades), precio: N(l.precio)}))};
}
let busy = false;
async function saveVenta() {
  if (busy) return; const d = D.venta;
  if (!d.fecha) return toast("Escribe la fecha de la factura.", true);
  const ced = String(d.cedula||"").trim(); if (!ced) return toast("Escribe la cédula o NIT del cliente, o elige Consumidor final.", true);
  const r = validateLines("venta", true); if (typeof r === "string") return toast(r, true);
  const total = sum(r.ls, l => l.unidades*l.precio);
  const pagos = d.pagos.filter(p => N(p.valor) > 0);
  if (!pagos.length) return toast("Escribe el valor del pago.", true);
  for (const p of pagos) if (MEDIOS[p.forma] && !p.medio) return toast(p.forma === "Crédito" ? "Para crédito elige la plataforma: Bold, Addi o Sistecrédito." : "Para transferencia elige el medio: Nequi o Bancolombia.", true);
  if (Math.abs(sum(pagos, p => p.valor) - total) >= 1) return toast("La suma de los pagos debe ser igual al total de la factura.", true);
  busy = true;
  try {
    if (!(await ensureCliente("venta"))) return;

async function saveSepare() {
  if (busy) return; const d = D.separe, ced = String(d.cedula||"").trim();
  if (!d.fecha) return toast("Escribe la fecha del separe.", true);
  if (!ced || ced === CF) return toast("Escribe la cédula o NIT de un cliente registrado.", true);
  const r = validateLines("separe", true); if (typeof r === "string") return toast(r, true);
  const total = sum(r.ls, l => l.unidades*l.precio), ab = N(d.abono);
  if (ab < 0) return toast("El abono inicial no es válido.", true);
  if (ab > total) return toast("El abono no puede ser mayor al total del separe.", true);
  if (ab > 0 && d.forma === "Transferencia" && !d.medio) return toast("Para transferencia elige el medio: Nequi o Bancolombia.", true);
  busy = true;
  try {
    if (!(await ensureCliente("separe"))) return;
    const nombre = cliBy(ced)?.nombre || d.nuevo.nombre.trim();
    const {id, numero} = await freeId("separes", "S-", nextNum(S.separes));
    const doc = {numero, fecha:d.fecha, limite:d.limite||"", cedula:ced, clienteNombre:nombre, lineas:r.ls, abonos: ab > 0 ? [{fecha:d.fecha, valor:ab, forma:d.forma, medio:d.forma==="Transferencia"?d.medio:""}] : [], estado:"Separado", nota:d.nota||"", creado:new Date().toISOString()};
    if (await save("separes", id, doc)) { D.separe = newSepare(); UI.sepForm = false; render(); toast(`Separe ${id} guardado. Total ${money(total)}, abono ${money(ab)}, saldo ${money(total-ab)}. La mercancía quedó apartada.`); }
  } catch (e) { toast("No se pudo guardar el separe: " + e.message, true); } finally { busy = false; }
}

  </tbody></table></div>`;

async function saveCompra() {
  if (busy) return; const d = D.compra;
  if (!d.fecha) return toast("Escribe la fecha de la compra.", true);
  if (d.forma === "Crédito" && !d.proveedor) return toast("Para compras a crédito elige el proveedor.", true);
  const ls = d.lineas.filter(l => l.producto || l.cantidad || l.costo);
  if (!ls.length) return toast("Escribe al menos un producto en la compra.", true);
  for (const [i, l] of ls.entries()) { if (!prodBy(l.producto)) return toast(`Línea ${i+1}: elige un producto de la lista (si es nuevo, créalo primero en Productos).`, true); if (!(N(l.cantidad) > 0)) return toast(`Línea ${i+1}: la cantidad debe ser mayor a 0.`, true); if (l.costo === "" || N(l.costo) < 0) return toast(`Línea ${i+1}: escribe el costo unitario.`, true); }
  busy = true;
  try {
    const {id, numero} = await freeId("compras", "C-", nextNum(S.compras));
    const doc = {numero, fecha:d.fecha, proveedor:d.proveedor||"", forma:d.forma, estado: d.forma === "Crédito" ? "Pendiente de pago" : "N/A", lineas: ls.map(l => ({producto:l.producto, cantidad:N(l.cantidad), costo:N(l.costo)})), creado:new Date().toISOString()};
    if (await save("compras", id, doc)) {
      if (d.actualizarCosto) for (const l of doc.lineas) await patch("productos", l.producto, {costo:l.costo});
      D.compra = newCompra(); UI.compForm = false; render(); toast(`Compra ${id} cargada: ${money(compraTotal(doc))}. La mercancía ya se sumó al inventario.`);
    }
  } catch (e) { toast("No se pudo cargar la compra: " + e.message, true); } finally { busy = false; }
}

function setPath(path, val) { const ks = path.split("."); let o = D; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length-1]] = val; }
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.bind) {
    setPath(t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
    if (t.dataset.noauto != null && D.venta) D.venta.pagos[+t.dataset.noauto].auto = false;
    if (t.tagName !== "SELECT" && !t.dataset.reChange) updateTotals();
    if (t.dataset.reChange && t.type === "number") updateTotals();
  }
  if (t.dataset.ui && t.tagName === "INPUT" && t.type !== "date") { const [a, b] = t.dataset.ui.split("."); UI[a][b] = t.value; render(); }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.bind) {
    setPath(t.dataset.bind, t.type === "checkbox" ? t.checked : t.value);
    const m = t.dataset.bind.match(/^(venta|separe|compra)\.lineas\.(\d+)\.producto$/);
    if (m) { const p = prodBy(t.value), l = D[m[1]].lineas[+m[2]]; if (p) { if (m[1] === "compra") { if (l.costo === "") l.costo = N(p.costo) || ""; if (!l.cantidad) l.cantidad = 1; } else if (l.precio === "" && N(p.precio)) l.precio = N(p.precio); } }
    const pm = t.dataset.bind.match(/^venta\.pagos\.(\d+)\.forma$/); if (pm) D.venta.pagos[+pm[1]].medio = "";
    if (t.dataset.bind === "separe.fecha" && t.value) D.separe.limite = addDays(t.value, 30);
    if (t.dataset.re || t.dataset.reChange) render(); else updateTotals();
  }
  if (t.dataset.ui && (t.tagName === "SELECT" || t.type === "date")) { const [a, b] = t.dataset.ui.split("."); UI[a][b] = t.value; render(); }
});
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === "BUTTON") e.preventDefault();
  const A = {

    filtroSinProd: () => { UI.ventas = {q:"", desde:"", hasta:"", forma:"sinprod", estado:"activa"}; },

    addPay: () => { const t = linesTotal("venta"), pag = sum(D.venta.pagos, p => p.valor); D.venta.pagos.forEach(p => p.auto = false); D.venta.pagos.push({forma:"Transferencia", medio:"", valor: Math.max(0, t - pag) || "", auto:false}); render(); },

    cf: () => { D.venta.cedula = CF; render(); },
    resetVenta: () => { D.venta = newVenta(); render(); },
    saveVenta, saveSepare, saveCompra,
    close: () => closeDlg(),
    verVenta: () => { const v = S.ventas.find(x => x.id === id); if (v) showFactura(v); },
    copyFactura: async () => { const v = S.ventas.find(x => x.id === id); const txt = facturaTexto(v); try { await navigator.clipboard.writeText(txt); toast("Texto copiado. Pégalo en WhatsApp."); } catch (err) { const ta = document.createElement("textarea"); ta.value = txt; ta.rows = 8; el.closest("dialog").querySelector(".db").appendChild(ta); ta.select(); toast("Selecciona y copia el texto que apareció abajo."); } },
    anular: () => anularDlg(id),
    borrarVenta: () => { const v = S.ventas.find(x => x.id === id); openDlg(`<div class="dh"><h3>Eliminar factura ${esc(id)}</h3><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="db">
      <p style="margin:0">Se borra para siempre, como si nunca se hubiera registrado: sale de las ventas y la mercancía vuelve al inventario. Úsalo para ventas de prueba o duplicadas; para devoluciones reales es mejor <b>Anular</b>, que deja el registro.</p>
      ${v && v.separe ? `<div class="note warn">Esta factura es la liquidación del separe ${esc(v.separe)}. El separe seguirá apareciendo como liquidado.</div>` : ""}
      <label class="f">Escribe ELIMINAR para confirmar<input id="delConf" autocomplete="off"></label></div>
      <div class="df"><button class="btn" data-act="close">Volver</button><button class="btn danger" data-act="doBorrarVenta" data-id="${esc(id)}">Eliminar factura</button></div>`); },
    doBorrarVenta: async () => { if ($("#delConf").value.trim().toUpperCase() !== "ELIMINAR") return toast("Escribe ELIMINAR para confirmar.", true); if (await remove("ventas", id)) { closeDlg(); toast(`Factura ${id} eliminada.`); } },
    doAnular: async () => { const mot = $("#anMot").value.trim(); if (!mot) return toast("Escribe el motivo de la anulación.", true); if (await patch("ventas", id, {estado:"anulada", motivo:mot, anuladaEl:new Date().toISOString()})) { closeDlg(); toast(`Factura ${id} anulada. La mercancía volvió al inventario.`); } },
    toggleSepForm: () => { UI.sepForm = !UI.sepForm; render(); },
    sepTab: () => { UI.separes.estado = el.dataset.v; render(); },
    abonar: () => abonarDlg(id), liquidar: () => liquidarDlg(id), cancelarSep: () => cancelarSepDlg(id),
    verSep: () => { const s = S.separes.find(x => x.id === id); openDlg(`<div class="dh"><h3>Separe ${esc(id)} · ${esc(s.clienteNombre)}</h3><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="db">${s.nota ? `<div class="note">${esc(s.nota)}</div>` : ""}${abonosTable(s)}</div><div class="df"><button class="btn pri" data-act="close">Cerrar</button></div>`); },
    doAbono: async () => {
      const s = S.separes.find(x => x.id === id), saldo = separeTotal(s) - separeAbonado(s), v = N($("#abV").value), f = $("#abF").value;
      if (!(v > 0)) return toast("El abono debe ser mayor a 0.", true); if (v > saldo) return toast(`El abono no puede ser mayor a lo que resta por pagar (${money(saldo)}).`, true); if (!f) return toast("Escribe la fecha del abono.", true);
      if (await patch("separes", id, {abonos:[...(s.abonos||[]), {fecha:f, valor:v, ...payFrom($("#abP").value)}]})) { closeDlg(); toast(`Abono de ${money(v)} registrado. Resta ${money(saldo - v)}.${saldo - v === 0 ? " Ya está pago: puedes liquidarlo." : ""}`); }
    },
    doLiquidar: async () => {
      if (busy) return; const s = S.separes.find(x => x.id === id); if (!s || s.estado !== "Separado") return;
      const saldo = separeTotal(s) - separeAbonado(s), abonos = [...(s.abonos||[])];
      if (saldo > 0) abonos.push({fecha: $("#lqF").value || todayISO(), valor:saldo, ...payFrom($("#lqP").value), final:true});
      busy = true;
      try {
        const {id: fid, numero} = await freeId("ventas", "F-", nextNum(S.ventas));
        const doc = {numero, fecha:todayISO(), clienteCedula:s.cedula, clienteNombre:s.clienteNombre, lineas:s.lineas, pagos:[{forma:"Plan separe", medio:"", valor:separeTotal(s)}], total:separeTotal(s), nota:`Liquidación del separe ${s.id}`, origen:"separe", separe:s.id, estado:"activa", creado:new Date().toISOString()};
        if (await save("ventas", fid, doc) && await patch("separes", id, {estado:"Liquidado", factura:fid, abonos, liquidadoEl:todayISO()})) { closeDlg(); toast(`Separe ${id} liquidado: pasó a Ventas como factura ${fid}.`); }
      } catch (err) { toast("No se pudo liquidar: " + err.message, true); } finally { busy = false; }
    },
    doCancelarSep: async () => { const s = S.separes.find(x => x.id === id), ab = separeAbonado(s); const r = $("#cnA")?.value; const nota = ab > 0 ? `Cancelado: abonos ${r} (${money(ab)})` : "Cancelado"; if (await patch("separes", id, {estado:"Cancelado", nota, canceladoEl:todayISO()})) { closeDlg(); toast(`Separe ${id} cancelado. La mercancía volvió al inventario disponible.`); } },
    toggleCompForm: () => { UI.compForm = !UI.compForm; render(); },
    compTab: () => { UI.compras.estado = el.dataset.v; render(); },
    pagarCompra: async () => { if (await patch("compras", id, {estado:"Pagada", pagadaEl:todayISO()})) toast(`Compra ${id} marcada como pagada.`); },
    invTab: () => { UI.inv.filtro = el.dataset.v; render(); },
    editProd: () => prodDlg(id),
    saveProd: async () => {
      const nombre = $("#pN").value.trim(); if (!nombre) return toast("Escribe el nombre del producto.", true);
      if (S.productos.some(p => p.id !== id && p.nombre.toLowerCase() === nombre.toLowerCase())) return toast("Ya existe un producto con ese nombre.", true);
      const doc = {nombre, unidad:$("#pU").value, costo:N($("#pC").value), precio:N($("#pP").value), stockMin:N($("#pM").value), cantInicial:N($("#pI").value)};
      if (el.dataset.new) { if (await save("productos", id, {...doc, creado:new Date().toISOString()})) { closeDlg(); toast(`Producto ${id} creado.`); } }
      else if (await patch("productos", id, doc)) { closeDlg(); toast("Producto actualizado."); }
    },
    editCli: () => cliDlg(id),
    saveCli: async () => {
      const ced = id || $("#cC").value.trim(), nombre = $("#cN").value.trim(), cel = $("#cT").value.trim(), dir = $("#cD").value.trim();
      if (!ced) return toast("Escribe la cédula o NIT.", true); if (ced === CF) return toast("222222222222 es para consumidor final; no se crea como cliente.", true);
      if (!/^[A-Za-z0-9.\-]+$/.test(ced)) return toast("La cédula o NIT solo puede tener números, letras, puntos o guiones.", true);
      if (!id && cliBy(ced)) return toast(`Este cliente ya está registrado: ${cliBy(ced).nombre}.`, true);
      if (!nombre || !dir || !cel) return toast("Escribe nombre, dirección y celular.", true);
      if (await save("clientes", ced, {nombre, direccion:dir, celular:cel, cumple:$("#cB").value || "", creado: cliBy(ced)?.creado || new Date().toISOString()})) { closeDlg(); toast(id ? "Cliente actualizado." : `Cliente creado: ${nombre}.`); }
    },
    askDel: () => delDlg(el.dataset.kind, id),
    askCero: () => { const r = inventario()[id]; if (!r) return; openDlg(`<div class="dh"><h3>Poner en cero ${esc(r.p.nombre)}</h3><button class="x" data-act="close" aria-label="Cerrar">×</button></div><div class="db">
      <p style="margin:0">El disponible pasa de <b>${num(r.disp)}</b> a <b>0</b>. Se ajusta la cantidad inicial (de ${num(r.p.cantInicial)} a ${num(N(r.p.cantInicial) - r.disp)}); las ventas, compras y separes no cambian.</p>
      <p class="muted" style="margin:0;font-size:12.5px">Úsalo después de un conteo físico o para sacar un producto que ya no hay en bodega.</p></div>
      <div class="df"><button class="btn" data-act="close">Volver</button><button class="btn pri" data-act="doCero" data-id="${esc(id)}">Poner en cero</button></div>`); },
    doCero: async () => { const r = inventario()[id]; if (!r) return; if (await patch("productos", id, {cantInicial: N(r.p.cantInicial) - r.disp})) { closeDlg(); toast(`${r.p.nombre}: disponible en 0.`); } },
    doDel: async () => {
      const k = el.dataset.kind; if ($("#delConf").value.trim().toUpperCase() !== "ELIMINAR") return toast("Escribe ELIMINAR para confirmar.", true);
      const col = {cli:"clientes", prov:"proveedores", comp:"compras", prod:"productos"}[k];
      if (await remove(col, id)) { closeDlg(); toast(k === "cli" ? "Cliente eliminado." : k === "prov" ? "Proveedor eliminado." : k === "prod" ? `Producto ${id} eliminado del inventario.` : `Compra ${id} eliminada. Su mercancía salió del inventario.`); }
    },
    delCli: async () => { if (await remove("clientes", id)) { closeDlg(); toast("Cliente eliminado."); } },
    editProv: () => provDlg(id),
    saveProv: async () => {
      const nombre = $("#vN").value.trim(); if (!nombre) return toast("Escribe el nombre del proveedor.", true);
      if (S.proveedores.some(p => p.id !== id && p.nombre.toLowerCase() === nombre.toLowerCase())) return toast("Ese proveedor ya está registrado.", true);
      const pid = id || "prov-" + Date.now().toString(36);
      if (await save("proveedores", pid, {nombre, producto:$("#vP").value.trim(), telefono:$("#vT").value.trim()})) { if (D.compra && !id) D.compra.proveedor = nombre; closeDlg(); toast(id ? "Proveedor actualizado." : `Proveedor creado: ${nombre}.`); }
    },
    delProv: async () => { if (await remove("proveedores", id)) { closeDlg(); toast("Proveedor eliminado."); } },
    exportVentas: () => exportCSV("ventas-atypical.csv", [["Factura","Fecha","Cliente","Cédula/NIT","Código","Producto","Detalle","Unidades","Precio unitario","Valor","Forma de pago","Estado","Nota"], ...ventasFiltradas().flatMap(v => (v.lineas||[]).map(l => [v.id, v.fecha, v.clienteNombre, v.clienteCedula, l.producto||"", l.nombre||"Sin producto", l.detalle, l.unidades, l.precio, l.unidades*l.precio, (v.pagos||[]).map(p => `${p.forma}${p.medio?" "+p.medio:""} ${p.valor}`).join(" + "), v.estado, v.nota||""]))]),
    exportInv: () => { const inv = inventario(); exportCSV("inventario-atypical.csv", [["Código","Producto","Inicial","Compras","Vendido","Separado","Disponible","Stock mínimo","Costo","Precio venta","Valor a costo","Semáforo"], ...Object.values(inv).sort((a,b)=>a.p.id.localeCompare(b.p.id)).map(r => [r.p.id, r.p.nombre, r.p.cantInicial, r.comprado, r.vendido, r.separado, r.disp, r.p.stockMin, r.p.costo, r.p.precio||0, r.valCosto, r.sem.t])]); },
  };
  if (A[act]) await A[act]();
});
async function exportCSV(name, rows) {
  const csv = "﻿" + rows.map(r => r.map(c => { const s = String(c ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(";")).join("\r\n");
  try { await S.dl.save({filename:name, data:csv}); } catch (e) { if (e && e.code !== "declined" && e.code !== "cancelled") toast("No se pudo descargar el archivo.", true); }
}

boot();
</script>
</body></html>
